# DAS (Distribution-Aware Speculative decoding) configuration.
# Consumed by every DAS participant (trainer driver, agent-loop workers,
# vLLM server actors, GPU workers) via the DAS_CONFIG_PATH env var.
# All values shown are the defaults; omitted keys fall back to these.
das:
  enabled: true

  # Sliding window over training iterations retained in the central store.
  # DAS paper ablations favor 16-32 on acceptance, but window tokens are
  # resident in EVERY tree-holding process (measured ~280 B/token via
  # arctic estimate_memory): 8 halves per-node residency vs 16 with most
  # of the warm-tree benefit intact at 32B/16k scale.
  window_iterations: 8

  # Iterations whose trajectories also carry a 2x-count shadow copy in the
  # trees — approximates the paper's recency down-weighting with raw-count
  # suffix trees. Memory overhead ~= fresh_iterations / window_iterations.
  fresh_iterations: 2

  # Suffix tree depth (bounds match length + draft length). Keep equal to
  # suffix_decoding_max_tree_depth in the vLLM speculative_config.
  max_tree_depth: 24

  # Draft-length scaling vs match length + confidence floor. Used by the
  # ngram host (vLLM 0.11.0); the suffix host (>= 0.11.1) reads these from
  # vLLM's speculative_config instead.
  max_spec_factor: 2.0
  min_token_prob: 0.1

  # Occupancy gate: 0 = draft every round (default). Measured on H100/H200
  # with a 4B model, decode is memory-bound even at full batch, so drafting
  # pays throughout the step (arm B3 vs A2); budgets + min_token_prob do the
  # waste control. Set a positive threshold only for compute-bound regimes
  # (large models / big batches) to confine drafting to the straggler tail.
  # Drafting-only: delta applies are governed by apply_on_poll, never this.
  tail_max_active: 0

  # Apply gate, decoupled from the drafting gate above. The service
  # withholds deltas until the training iteration advances (per-iteration
  # serving), so with apply_on_poll the pump's applies land exactly once
  # per step, during the new rollout's prefill window — never mid-decode,
  # never in the training window, regardless of verl sleep internals.
  # false = applies happen only in the wake_up boundary drain (requires
  # verl to drive vLLMHttpServer.wake_up; it does not on 0.9 colocated).
  apply_on_poll: true

  # Cap on the engine-local request-scoped suffix cache (arctic
  # SuffixDecodingCache; both hosts). Stock cap is 10k requests ~= 70M
  # resident tokens at 16k generations; 2k bounds worker RSS without
  # touching active requests (only completed ones are evicted).
  engine_cache_max_requests: 2000

  # Engine delta-pump poll cadence. Mid-iteration polls return nothing
  # (per-iteration serving); this only bounds how soon after a step
  # boundary the freshly-servable deltas are fetched and applied.
  poll_interval_s: 2.0

  # Upper bound on tokens per delta batch (both RPC hops); pumps loop
  # until drained, so this bounds stall time, not throughput.
  max_delta_batch_tokens: 500000

  # Length-aware speculation budgets (max draft tokens per class).
  # short: 0 disables drafting for Short requests entirely.
  budgets:
    long: 24
    medium: 8
    short: 0

  # Generation-length thresholds separating the classes. A problem's class
  # comes from the EMA of its historical generation lengths; a running
  # request is upgraded (never downgraded) when its observed length crosses
  # a threshold.
  classifier:
    short_max_tokens: 256
    long_min_tokens: 1024

  # Central store memory bounds. Breaches evict oldest iterations first,
  # then least-recently-pushed problems, and broadcast the removals.
  service:
    max_total_tokens: 64000000
    max_problems: 8192
    max_seqs_per_problem: 512

  # Hook-side push batching (fire-and-forget; overflow drops with a counter).
  push:
    batch_size: 64
    flush_interval_s: 0.5
    queue_capacity: 4096

  # Window handles policy drift; a reset is only for genuine model swaps.
  reset_on_weight_update: false
